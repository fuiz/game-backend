# GitLab CI configuration for Rust project
image: rust:latest

# Cache cargo dependencies
variables:
  CARGO_HOME: $CI_PROJECT_DIR/cargo

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - cargo/
    - target/

# Define stages
stages:
  - format
  - check
  - lint
  - doc
  - test
  - build
  - deploy

# Before script to install necessary components
before_script:
  - rustc --version && cargo --version
  - rustup component add rustfmt clippy

# Format check
format:
  stage: format
  script:
    - cargo fmt --all -- --check
  allow_failure: false

# Cargo check
check:
  stage: check
  script:
    - cargo check --all-targets --all-features
  allow_failure: false

# Clippy linting
clippy:
  stage: lint
  script:
    - cargo clippy --all-targets --all-features -- -D warnings
  allow_failure: false

# Documentation check
doc:
  stage: doc
  script:
    - cargo doc --all --no-deps --document-private-items
  allow_failure: false

# Run tests
test:
  stage: test
  script:
    - cargo test --all-features --verbose
  coverage: '/^\d+\.\d+% coverage/'
  artifacts:
    reports:
      junit: test-results.xml
    expire_in: 1 week
  allow_failure: false

.build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-fuiz-server:
  extends: .build-image
  script:
    - docker build --pull --target fuiz-server -t $CI_REGISTRY_IMAGE/fuiz-server:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/fuiz-server:latest .
    - docker push $CI_REGISTRY_IMAGE/fuiz-server:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/fuiz-server:latest

build-corkboard-server:
  extends: .build-image
  script:
    - docker build --pull --target corkboard-server -t $CI_REGISTRY_IMAGE/corkboard-server:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/corkboard-server:latest .
    - docker push $CI_REGISTRY_IMAGE/corkboard-server:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/corkboard-server:latest

# Cloudflare Workers deployment.
#
# Replaces Cloudflare's own Workers Builds, which does not cache Cargo and so
# recompiled worker-build and every dependency on each deploy. Needs
# CLOUDFLARE_API_TOKEN (Edit Workers template) and CLOUDFLARE_ACCOUNT_ID as
# masked project variables.
.deploy-worker:
  stage: deploy
  image: rust:latest
  variables:
    WORKER_BUILD_VERSION: "0.8.7"
    WRANGLER_VERSION: "4.152.0"
    BUN_VERSION: "1.4.4"
    # Baseline build, so it does not require AVX2 from the runner. Checksum from
    # the release's SHASUMS256.txt; update both together.
    BUN_SHA256: "e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76"
    XDG_CACHE_HOME: $CI_PROJECT_DIR/.cache
    BUN_INSTALL: $CI_PROJECT_DIR/.cache/bun
  # Per-job key. Both deploy jobs can run in the same stage, and a shared key
  # lets whichever finishes last overwrite the other's target directory. It also
  # keeps the wasm target out of the one the check/clippy/test jobs share.
  cache:
    key: ${CI_COMMIT_REF_SLUG}-${CI_JOB_NAME_SLUG}
    paths:
      - cargo/
      - target/
      - .cache/
  before_script:
    - export PATH="$CARGO_HOME/bin:$BUN_INSTALL/bin:$PATH"
    - rustup target add wasm32-unknown-unknown
    - |
      if ! bun --version 2>/dev/null | grep -Fqx "$BUN_VERSION"; then
        command -v unzip > /dev/null || { apt-get update && apt-get install -y --no-install-recommends unzip; }
        curl -fsSL -o /tmp/bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64-baseline.zip"
        echo "$BUN_SHA256  /tmp/bun.zip" | sha256sum -c -
        unzip -q -o /tmp/bun.zip -d /tmp/bun
        install -D -m755 /tmp/bun/bun-linux-x64-baseline/bun "$BUN_INSTALL/bin/bun"
      fi
    - worker-build --version 2>/dev/null | grep -Fqx "$WORKER_BUILD_VERSION" || cargo install worker-build --locked --version "$WORKER_BUILD_VERSION"

deploy-fuiz-cloudflare:
  extends: .deploy-worker
  script:
    - cd game/cloudflare
    - bunx wrangler@$WRANGLER_VERSION deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.toml
        - Cargo.lock
        - game/logic/**/*
        - game/cloudflare/src/**/*
        - game/cloudflare/Cargo.toml
        - game/cloudflare/wrangler.toml

deploy-corkboard-cloudflare:
  extends: .deploy-worker
  script:
    - cd corkboard/cloudflare
    - bunx wrangler@$WRANGLER_VERSION deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.toml
        - Cargo.lock
        - corkboard/logic/**/*
        - corkboard/cloudflare/src/**/*
        - corkboard/cloudflare/Cargo.toml
        - corkboard/cloudflare/wrangler.toml

# TypeScript worker that fuiz-cloudflare binds to as COUNTER.
deploy-counter:
  stage: deploy
  image: oven/bun:latest
  cache: []
  before_script: []
  script:
    - cd game/cloudflare/counter
    - bun install --frozen-lockfile
    - bunx wrangler deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - game/cloudflare/counter/**/*
